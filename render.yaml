# Render Blueprint — import this when creating the web service from GitHub.
# Docs: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: yea-website
    runtime: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "yeanj.org,www.yeanj.org,.onrender.com"
      - key: SITE_URL
        value: "https://yeanj.org"
      - key: CONTACT_EMAIL
        value: "info@yeanj.org"
      - key: DEFAULT_FROM_EMAIL
        value: "info@yeanj.org"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: yea-db
          property: connectionString

databases:
  - name: yea-db
    plan: basic-256mb
