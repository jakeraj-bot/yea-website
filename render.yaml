# Render Blueprint — import this when creating the web service from GitHub.
# Docs: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: yea-website
    runtime: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "yeanj.org,www.yeanj.org,.onrender.com"
      - key: SITE_URL
        value: "https://yeanj.org"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://yeanj.org,https://www.yeanj.org"
      - key: PORTALS_PUBLIC
        value: "False"
      - key: PORTAL_BOOTSTRAP_ON_DEPLOY
        value: "True"
      - key: CONTACT_EMAIL
        value: "info@yeanj.org"
      - key: DEFAULT_FROM_EMAIL
        value: "info@yeanj.org"
      - key: ENROLLMENT_NOTIFICATION_EMAIL
        value: "jakeraj@yeanj.org"
      # SMTP — set these in Render dashboard (never commit passwords):
      # EMAIL_HOST=smtp.gmail.com  EMAIL_PORT=587  EMAIL_USE_TLS=True
      # EMAIL_HOST_USER=info@yeanj.org  EMAIL_HOST_PASSWORD=<Google App Password>
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: yea-db
          property: connectionString

databases:
  - name: yea-db
    plan: basic-256mb
