<div class="portal-families-toolbar card" id="families-list-toolbar">
  <div class="portal-families-toolbar-row">
    <label class="portal-filter-label portal-families-search-label">
      Search
      <input type="search" class="portal-input portal-search" id="families-search" placeholder="Family, contact, or child" autocomplete="off">
    </label>
    <label class="portal-filter-label">
      Unit
      <select class="portal-select" id="families-unit-filter">
        <option value="all">All units</option>
        {% for unit in units %}
        <option value="{{ unit.slug }}">{{ unit.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="portal-filter-label">
      Filter
      <select class="portal-select" id="families-filter">
        <option value="all">All families</option>
        <option value="active">Active</option>
        <option value="pending-enrollment">Pending enrollment</option>
        <option value="past-due">Past due</option>
        <option value="4cs">4Cs</option>
        <option value="private-pay">Private pay</option>
        <option value="no-application">No application</option>
        <option value="no-login">No parent login</option>
        <option value="suspended">Suspended</option>
      </select>
    </label>
    <label class="portal-filter-label">
      Sort
      <select class="portal-select" id="families-sort">
        <option value="name-asc">Family name A–Z</option>
        <option value="name-desc">Family name Z–A</option>
        <option value="unit-asc">Unit A–Z</option>
        <option value="unit-desc">Unit Z–A</option>
        <option value="balance-desc">Family balance (high to low)</option>
        <option value="balance-asc">Family balance (low to high)</option>
        <option value="child-balance-desc">Child balance (high to low)</option>
        <option value="child-balance-asc">Child balance (low to high)</option>
        <option value="contact-asc">Primary contact A–Z</option>
      </select>
    </label>
    <label class="portal-filter-label">
      Show
      <select class="portal-select" id="families-page-size">
        <option value="10">10 rows</option>
        <option value="25" selected>25 rows</option>
        <option value="50">50 rows</option>
        <option value="all">All</option>
      </select>
    </label>
  </div>

  <div class="portal-families-toolbar-row portal-families-toolbar-row-secondary">
    <details class="portal-columns-picker" id="families-columns-picker">
      <summary class="btn btn-secondary btn-sm">Columns</summary>
      <div class="portal-columns-picker-panel">
        <p class="form-note">Choose which columns to show in the table.</p>
        <div class="portal-columns-picker-grid">
          <label><input type="checkbox" data-col-toggle="unit" checked> Unit</label>
          <label><input type="checkbox" data-col-toggle="family" checked> Family</label>
          <label><input type="checkbox" data-col-toggle="contact"> Primary contact</label>
          <label><input type="checkbox" data-col-toggle="child" checked> Child</label>
          <label><input type="checkbox" data-col-toggle="school"> School attending</label>
          <label><input type="checkbox" data-col-toggle="medical" checked> Medical</label>
          <label><input type="checkbox" data-col-toggle="program"> Program</label>
          <label><input type="checkbox" data-col-toggle="billing" checked> Billing</label>
          <label><input type="checkbox" data-col-toggle="child-balance" checked> Child balance</label>
          <label><input type="checkbox" data-col-toggle="family-balance" checked> Family balance</label>
          <label><input type="checkbox" data-col-toggle="status" checked> Status</label>
        </div>
      </div>
    </details>
    <p class="form-note portal-families-results" id="families-results-summary" aria-live="polite"></p>
    <nav class="portal-families-pagination" id="families-pagination" aria-label="Families pages"></nav>
  </div>
</div>
