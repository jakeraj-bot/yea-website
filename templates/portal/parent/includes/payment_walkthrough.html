{% load static parent_i18n %}
<div class="card card-accent portal-pay-howto" id="parent-pay-howto">
  <h2>{% if parent_lang == 'es' %}{% pt "how_to_pay" %} / {% pt "how_to_pay_es_title" %}{% else %}{% pt "how_to_pay" %} / Cómo pagar{% endif %}</h2>
  <video class="portal-pay-howto-video" controls playsinline preload="metadata" poster="{% static 'images/yea-logo.png' %}">
    <source src="{% static 'videos/parent-pay-howto.mp4' %}" type="video/mp4">
  </video>
  <p class="form-note portal-pay-howto-caption" data-lang-panel="en"{% if parent_lang == 'es' %} hidden{% endif %}>{% pt "pay_video_caption_en" %}</p>
  <p class="form-note portal-pay-howto-caption" data-lang-panel="es"{% if parent_lang != 'es' %} hidden{% endif %}>{% pt "pay_video_caption_es" %}</p>
  <p class="form-note" style="margin:0.45rem 0 0">
    <a class="btn btn-secondary btn-sm" href="{% if admin_preview_sample %}{% url 'portal_admin_parent_preview_sample_page' page='help' %}{% elif admin_support_preview and admin_preview_family_slug %}{% url 'portal_admin_parent_preview_page' family_slug=admin_preview_family_slug page='help' %}{% if admin_preview_family_id %}?id={{ admin_preview_family_id }}{% endif %}{% else %}{% url 'portal_parent_page' page='help' %}{{ parent_pay_query }}{% endif %}">{% pt "open_help" %}</a>
  </p>
</div>
