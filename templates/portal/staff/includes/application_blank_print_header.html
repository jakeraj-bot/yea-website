{% load static %}
<tr class="portal-print-title-row">
  <th colspan="{{ colspan|default:1 }}" scope="colgroup">
    <div class="portal-print-running-header">
      <img src="{% static 'images/yea-logo.png' %}" alt="" class="portal-medical-report-logo portal-print-running-logo">
      <div>
        <strong class="portal-print-running-title">{{ sheet_title|default:"Application" }}</strong>
        <p class="portal-medical-report-meta">
          Blank paper form{% if staff_unit %} · {{ staff_unit }}{% endif %}{% if generated_date %} · {{ generated_date }}{% endif %}
        </p>
      </div>
    </div>
  </th>
</tr>
