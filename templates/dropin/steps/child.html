{% extends "dropin/register_base.html" %}

{% block dropin_content %}
<h2>{{ step_titles.child }}</h2>
<form method="post" class="apply-form" novalidate>
  {% csrf_token %}
  <div class="form-grid">
    {% for field in form %}
    <div class="form-group">
      {{ field.label_tag }}
      {{ field }}
      {{ field.errors }}
    </div>
    {% endfor %}
  </div>
  <div class="apply-actions">
    <a class="btn btn-secondary" href="{% url 'dropin_register' step=prev_step %}">Back</a>
    <button type="submit" class="btn btn-primary">Continue</button>
  </div>
</form>
{% endblock %}
