{% extends "enrollment/apply_base.html" %}
{% load enrollment_extras %}

{% block step_content %}
<section class="apply-section">
  <header class="apply-section-header">
    <h3 class="apply-section-title">Add another child? {% include "enrollment/includes/required_mark.html" %}</h3>
    <p class="apply-section-desc">Choose whether to enroll another child in this same application.</p>
  </header>
  <div class="form-grid">
    {% apply_field form.add_another full=True %}
  </div>
</section>
{% endblock %}
