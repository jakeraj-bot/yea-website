{% if step != "family" and step != "review" %}
<div class="apply-child-badge">
  <span class="apply-child-badge-label">Child {{ child_number }}</span>
  {% if child_count > 1 %}
  <span class="apply-child-badge-meta">{{ child_count }} children in this application</span>
  {% endif %}
</div>
{% endif %}
